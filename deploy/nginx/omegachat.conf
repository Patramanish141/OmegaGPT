# OmegaGPT nginx server block.
#
# Copy to /etc/nginx/sites-available/omegachat, symlink it into
# sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.

# Echoes the client's Upgrade header back on the Connection header. Socket.IO
# starts on HTTP polling and only then upgrades, so hardcoding
# `proxy_set_header Connection "upgrade";` would mislabel the polling requests;
# this map sends "upgrade" exactly when the client asked for it and "close"
# otherwise. Declared at http level — keep it outside the server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream omegachat_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your own hostname.
    server_name ec2-16-171-166-254.eu-north-1.compute.amazonaws.com;

    root /var/www/omegachat;
    index index.html;

    # The Angular build output; deep links are handled by the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable, index.html must never be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket endpoint. This is the block that needs the upgrade handshake:
    # without proxy_http_version 1.1 plus the two headers below, nginx strips
    # the upgrade and Socket.IO silently falls back to long polling forever.
    location /socket.io/ {
        proxy_pass http://omegachat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Token streams can idle between chunks; do not cut them at 60s.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # REST API, including /api/auth/*. The SPA keeps the bare /login and
    # /signup paths for its own router.
    location /api/ {
        proxy_pass http://omegachat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://omegachat_api;
        proxy_set_header Host $host;
        access_log off;
    }
}
