<div class="auth-root">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <svg class="logo-svg" viewBox="0 0 41 41" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M37.5 20.5C37.5 29.9 29.9 37.5 20.5 37.5C11.1 37.5 3.5 29.9 3.5 20.5C3.5 11.1 11.1 3.5 20.5 3.5C29.9 3.5 37.5 11.1 37.5 20.5Z"
          stroke="currentColor"
          stroke-width="2"
        />
        <path
          d="M20.5 14.5C23.8 14.5 26.5 17.2 26.5 20.5C26.5 23.8 23.8 26.5 20.5 26.5C17.2 26.5 14.5 23.8 14.5 20.5C14.5 17.2 17.2 14.5 20.5 14.5Z"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your OmegaGPT account</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-group">
        <label class="field-label" for="login-email">Email</label>
        <input
          id="login-email"
          class="field-input"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="login-password">Password</label>
        <div class="password-wrapper">
          <input
            id="login-password"
            class="field-input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            tabindex="-1"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="togglePassword()"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="spinner"></span>
        } @else {
          Sign in
        }
      </button>
    </form>

    <div class="auth-switch">
      Don't have an account?
      <a routerLink="/signup" class="switch-link">Sign up</a>
    </div>
  </div>
</div>
